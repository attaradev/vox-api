name: Build and Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g. production, staging)"
        required: false
        default: production
      auto_apply:
        description: "Apply Terraform changes and deploy"
        required: false
        default: "false"

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.inputs.environment || 'production' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKDIR: infra/terraform
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

jobs:
  bootstrap_state:
    name: Bootstrap TF Backend
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Prepare Terraform environment variables
        run: |
          set -euo pipefail
          TF_BACKEND_KEY="state/${{ env.DEPLOY_ENV }}/terraform.tfstate"
          echo "TF_BACKEND_KEY=${TF_BACKEND_KEY}" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=${{ env.DEPLOY_ENV }}" >> "$GITHUB_ENV"
          echo "TF_VAR_additional_tags={\"DeployedBy\":\"GitHubActions\",\"Workflow\":\"${GITHUB_WORKFLOW}\",\"RunId\":\"${GITHUB_RUN_ID}\",\"CommitSHA\":\"${GITHUB_SHA}\"}" >> "$GITHUB_ENV"

      - name: Ensure Terraform state bucket
        env:
          BUCKET: ${{ env.TF_STATE_BUCKET }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket exists."
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{
              "Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration '{
              "BlockPublicAcls":true,"IgnorePublicAcls":true,"BlockPublicPolicy":true,"RestrictPublicBuckets":true}'
          fi

  terraform_infra:
    name: Terraform (Init/Plan/Apply)
    runs-on: ubuntu-latest
    needs: [bootstrap_state]
    permissions: { id-token: write, contents: read }
    outputs:
      ecr_repo_url: ${{ steps.outputs_step.outputs.ecr_repo_url || '' }}
      apply_requested: ${{ steps.apply_mode.outputs.auto_apply }}
      ecs_cluster_name: ${{ steps.outputs_step.outputs.ecs_cluster_name || '' }}
      ecs_service_name: ${{ steps.outputs_step.outputs.ecs_service_name || '' }}
      ecs_task_family: ${{ steps.outputs_step.outputs.ecs_task_family || '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with: { terraform_wrapper: false }

      - name: Determine apply mode
        id: apply_mode
        run: |
          AUTO_APPLY_INPUT="${{ github.event.inputs.auto_apply || 'false' }}"
          AUTO_APPLY=$(echo "$AUTO_APPLY_INPUT" | tr '[:upper:]' '[:lower:]')
          if [[ "$AUTO_APPLY" != "true" ]]; then
            AUTO_APPLY="false"
          fi
          echo "Auto-apply set to $AUTO_APPLY"
          echo "auto_apply=$AUTO_APPLY" >> "$GITHUB_OUTPUT"

      - name: Prepare Terraform backend variables
        run: |
          set -euo pipefail
          TF_BACKEND_KEY="state/${{ env.DEPLOY_ENV }}/terraform.tfstate"
          echo "TF_BACKEND_KEY=${TF_BACKEND_KEY}" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=${{ env.DEPLOY_ENV }}" >> "$GITHUB_ENV"
          echo "TF_VAR_additional_tags={\"DeployedBy\":\"GitHubActions\",\"Workflow\":\"${GITHUB_WORKFLOW}\",\"RunId\":\"${GITHUB_RUN_ID}\",\"CommitSHA\":\"${GITHUB_SHA}\"}" >> "$GITHUB_ENV"

      - name: Terraform Init (with backend)
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          BUCKET: ${{ env.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -reconfigure -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=${TF_BACKEND_KEY}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Select Terraform workspace
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform workspace select "${{ env.DEPLOY_ENV }}" 2>/dev/null || terraform workspace new "${{ env.DEPLOY_ENV }}"

      - name: Remove legacy state entries
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          LEGACY_ADDRESSES=(
            "module.vpc.module.vpc.aws_route.private_nat_gateway[0]"
            "module.vpc.module.vpc.aws_route_table.private[0]"
            "module.vpc.module.vpc.aws_route.public_internet_gateway[0]"
            "module.vpc.module.vpc.aws_subnet.public[0]"
            "module.vpc.module.vpc.aws_subnet.public[1]"
            "module.vpc.module.vpc.aws_route_table.public[0]"
            "module.vpc.module.vpc.aws_subnet.private[0]"
            "module.vpc.module.vpc.aws_subnet.private[1]"
            "aws_security_group.alb"
            "aws_vpc_endpoint.secretsmanager"
            "aws_security_group.endpoints"
            "aws_ssm_parameter.database_url"
            "aws_security_group.ecs_tasks"
            "aws_vpc_endpoint.s3"
            "aws_vpc_endpoint.cloudwatch"
            "aws_security_group.rds"
            "aws_security_group.redis"
            "aws_iam_role_policy_attachment.ecs_task_execution[\"arn:aws:iam::aws:policy/AmazonSSMReadOnlyAccess\"]"
            "aws_iam_role_policy_attachment.ecs_task_execution[\"arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy\"]"
          )

          for addr in "${LEGACY_ADDRESSES[@]}"; do
            if terraform state show "$addr" >/dev/null 2>&1; then
              terraform state rm "$addr"
            fi
          done

          terraform state list >/dev/null

      - name: Terraform Validate & Plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan -input=false -no-color

      - name: Terraform Apply
        if: steps.apply_mode.outputs.auto_apply == 'true'
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false tfplan

      - name: Capture outputs
        id: outputs_step
        if: steps.apply_mode.outputs.auto_apply == 'true'
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          extract_output() {
            local name="$1"
            if value=$(terraform output -raw "$name" 2>/dev/null); then
              echo "$name=${value}" >> "$GITHUB_OUTPUT"
            else
              echo "Output $name not available" >&2
            fi
          }

          extract_output ecr_repository_url
          extract_output ecs_cluster_name
          extract_output ecs_service_name
          extract_output ecs_task_family

      - name: Show non-sensitive outputs
        if: steps.apply_mode.outputs.auto_apply == 'true'
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          echo "Terraform outputs:"
          terraform output -no-color alb_dns_name 2>/dev/null || echo "alb_dns_name: not available"
          terraform output -no-color alb_hosted_zone_id 2>/dev/null || echo "alb_hosted_zone_id: not available"

  build_and_push_image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [terraform_infra]
    if: needs.terraform_infra.outputs.apply_requested == 'true'
    permissions: { id-token: write, contents: read }
    outputs:
      image: ${{ steps.build_push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build_push
        env:
          ECR_REPO_URL: ${{ needs.terraform_infra.outputs.ecr_repo_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$ECR_REPO_URL" ]; then
            echo "Error: ECR repository URL not available" >&2
            exit 1
          fi
          IMAGE="${ECR_REPO_URL}:${IMAGE_TAG}"
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy_ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [terraform_infra, build_and_push_image]
    if: needs.terraform_infra.outputs.apply_requested == 'true' && needs.build_and_push_image.result == 'success'
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Register new task definition revision
        id: register_td
        env:
          ECS_TASK_FAMILY: ${{ needs.terraform_infra.outputs.ecs_task_family }}
          NEW_IMAGE: ${{ needs.build_and_push_image.outputs.image }}
        run: |
          set -euo pipefail
          if [ -z "$ECS_TASK_FAMILY" ]; then
            echo "Error: ECS task family output was empty" >&2
            exit 1
          fi
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' > td.json

          jq --arg img "$NEW_IMAGE" \
             '.containerDefinitions[0].image = $img |
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             td.json > td-new.json

          NEW_TD_ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$NEW_TD_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        env:
          ECS_CLUSTER: ${{ needs.terraform_infra.outputs.ecs_cluster_name }}
          ECS_SERVICE: ${{ needs.terraform_infra.outputs.ecs_service_name }}
          TASK_DEF_ARN: ${{ steps.register_td.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          if [ -z "$ECS_CLUSTER" ] || [ -z "$ECS_SERVICE" ]; then
            echo "Error: ECS cluster/service outputs were empty" >&2
            exit 1
          fi
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query 'service.serviceArn' >/dev/null
