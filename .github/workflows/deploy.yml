name: Build and Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment (e.g., production, staging)"
        required: false
        default: production
      auto_apply:
        description: "If true, run 'terraform apply' after planning"
        required: false
        default: "false"

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.inputs.environment || 'production' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKDIR: infra/terraform
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
  PROJECT_NAME: vox-api

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
      TF_VAR_environment: ${{ github.event.inputs.environment || 'production' }}
      TF_VAR_short_environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/aws-setup
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.TF_WORKDIR }}
          state-bucket: ${{ env.TF_STATE_BUCKET }}
          backend-key: state/${{ env.DEPLOY_ENV }}/terraform.tfstate
          environment: ${{ env.DEPLOY_ENV }}
          aws-region: ${{ env.AWS_REGION }}
          run-plan: "true"
          run-apply: ${{ github.event.inputs.auto_apply || 'false' }}

  build_and_push_image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [terraform]
    permissions: { id-token: write, contents: read }
    outputs:
      image_tag: ${{ steps.image_meta.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/aws-setup
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.TF_WORKDIR }}
          state-bucket: ${{ env.TF_STATE_BUCKET }}
          backend-key: state/${{ env.DEPLOY_ENV }}/terraform.tfstate
          environment: ${{ env.DEPLOY_ENV }}
          aws-region: ${{ env.AWS_REGION }}
          run-plan: "false"
          run-apply: "false"

      - name: Select workspace
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform workspace select "${{ env.DEPLOY_ENV }}" 2>/dev/null || terraform workspace new "${{ env.DEPLOY_ENV }}"

      - name: Read ECR repository name
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          repo=$(terraform output -raw ecr_repository_name 2>/dev/null || true)
          if [ -z "${repo}" ] || [ "${repo}" = "null" ]; then
            repo="${PROJECT_NAME:-vox-api}"
          fi
          echo "ECR_REPOSITORY_NAME=${repo}" >> "$GITHUB_ENV"

      - name: Determine image metadata
        id: image_meta
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          full_sha="${GITHUB_SHA:-${{ github.sha }}}"
          short_sha="${full_sha:0:7}"
          echo "IMAGE_TAG=${short_sha}" >> "$GITHUB_OUTPUT"
          if [ -z "${REGISTRY}" ]; then
            echo "ECR registry missing from login step; cannot compose repository URL." >&2
            exit 1
          fi
          name="${ECR_REPOSITORY_NAME}"
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            name="${PROJECT_NAME:-vox-api}"
          fi
          echo "IMAGE_URI=${REGISTRY}/${name}:${short_sha}" >> "$GITHUB_ENV"

      - name: Build & push
        run: |
          set -euo pipefail
          if [ -z "${IMAGE_URI:-}" ]; then
            echo "IMAGE_URI missing" >&2
            exit 1
          fi
          docker build --pull --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

  apply_image_tag:
    name: Apply image_tag to Terraform (register new task def)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    needs: [terraform, build_and_push_image]
    outputs:
      image_tag: ${{ steps.set_outputs.outputs.IMAGE_TAG }}
    permissions: { id-token: write, contents: read }
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
      TF_WORKDIR: infra/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/aws-setup
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.TF_WORKDIR }}
          state-bucket: ${{ env.TF_STATE_BUCKET }}
          backend-key: state/${{ env.DEPLOY_ENV }}/terraform.tfstate
          environment: ${{ env.DEPLOY_ENV }}
          aws-region: ${{ env.AWS_REGION }}
          run-plan: "false"
          run-apply: "false"

      - name: Set IMAGE_TAG env from build job
        run: |
          echo "IMAGE_TAG=${{ needs.build_and_push_image.outputs.image_tag }}" >> "$GITHUB_ENV"

      - name: Select workspace and apply image_tag
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform workspace select "${{ env.DEPLOY_ENV }}" 2>/dev/null || terraform workspace new "${{ env.DEPLOY_ENV }}"
          if [ -z "${IMAGE_TAG:-}" ]; then
            echo "No image tag found from build job" >&2
            exit 1
          fi
          terraform init -input=false
          terraform apply -var "image_tag=${IMAGE_TAG}" -auto-approve

      - name: set outputs
        id: set_outputs
        run: |
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  run_migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [apply_image_tag]
    permissions: { id-token: write, contents: read }
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}
      TF_WORKDIR: infra/terraform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/aws-setup
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: ./.github/actions/terraform-setup
        with:
          working-directory: ${{ env.TF_WORKDIR }}
          state-bucket: ${{ env.TF_STATE_BUCKET }}
          backend-key: state/${{ env.DEPLOY_ENV }}/terraform.tfstate
          environment: ${{ env.DEPLOY_ENV }}
          aws-region: ${{ env.AWS_REGION }}
          run-plan: "false"
          run-apply: "false"

      - name: Select workspace
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform workspace select "${{ env.DEPLOY_ENV }}" 2>/dev/null || terraform workspace new "${{ env.DEPLOY_ENV }}"

      - name: Capture migration inputs
        id: mig_inputs
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          outputs=$(terraform output -json)
          echo "ECS_CLUSTER=$(echo "$outputs" | jq -r '.ecs_cluster_name.value')" >> "$GITHUB_ENV"
          echo "TASK_DEFINITION=$(echo "$outputs" | jq -r '.ecs_task_family.value')" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=$(echo "$outputs" | jq -r '.ecs_api_container_name.value')" >> "$GITHUB_ENV"
          echo "SERVICE_SG=$(echo "$outputs" | jq -r '.ecs_service_security_group_id.value')" >> "$GITHUB_ENV"
          echo "SUBNETS_JSON=$(echo "$outputs" | jq -c '.private_app_subnet_ids.value')" >> "$GITHUB_ENV"

      - name: Run migrations task
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import copy
          import json
          import os
          import sys
          import boto3

          cluster = os.environ['ECS_CLUSTER']
          region = os.environ['AWS_REGION']
          family = os.environ['TASK_DEFINITION']
          container_name = os.environ['CONTAINER_NAME']
          subnets = json.loads(os.environ['SUBNETS_JSON'])
          service_sg = os.environ['SERVICE_SG']

          if not subnets:
              print('No private subnets provided for migration task', file=sys.stderr)
              sys.exit(1)

          ecs = boto3.client('ecs', region_name=region)

          # Get latest task definition for the service family
          list_resp = ecs.list_task_definitions(familyPrefix=family, sort='DESC', maxResults=1)
          if not list_resp['taskDefinitionArns']:
              print(f'No task definitions found for family {family}', file=sys.stderr)
              sys.exit(1)
          base_td_arn = list_resp['taskDefinitionArns'][0]
          base_td = ecs.describe_task_definition(taskDefinition=base_td_arn)['taskDefinition']

          # Clone container definition for migrations
          api_container = next((c for c in base_td['containerDefinitions'] if c['name'] == container_name), None)
          if api_container is None:
              print(f'Container {container_name} not found in task definition {base_td_arn}', file=sys.stderr)
              sys.exit(1)

          migrate_container = copy.deepcopy(api_container)
          migrate_container['command'] = ['python', 'manage.py', 'migrate', '--noinput']
          # Ensure migrations run in entrypoint
          existing_env = {env['name']: env['value'] for env in migrate_container.get('environment', [])}
          existing_env.update({
              'RUN_DB_MIGRATIONS': '1',
              'SKIP_DB_MIGRATIONS': '0',
              'SERVICE_ROLE': 'migrate',
          })
          migrate_container['environment'] = [{'name': k, 'value': v} for k, v in existing_env.items()]

          # Update log stream prefix for clarity
          log_cfg = migrate_container.get('logConfiguration', {})
          if log_cfg.get('logDriver') == 'awslogs':
              options = log_cfg.setdefault('options', {})
              options['awslogs-stream-prefix'] = 'migrate'

          migrate_td_def = {
              'family': f"{family}-migrate",
              'taskRoleArn': base_td.get('taskRoleArn'),
              'executionRoleArn': base_td.get('executionRoleArn'),
              'networkMode': base_td['networkMode'],
              'containerDefinitions': [migrate_container],
              'requiresCompatibilities': base_td.get('requiresCompatibilities', []),
              'cpu': base_td.get('cpu'),
              'memory': base_td.get('memory'),
              'runtimePlatform': base_td.get('runtimePlatform'),
              'volumes': base_td.get('volumes', []),
          }

          register_resp = ecs.register_task_definition(**migrate_td_def)
          migrate_td_arn = register_resp['taskDefinition']['taskDefinitionArn']

          try:
              run_resp = ecs.run_task(
                  cluster=cluster,
                  launchType='FARGATE',
                  taskDefinition=migrate_td_arn,
                  count=1,
                  networkConfiguration={
                      'awsvpcConfiguration': {
                          'subnets': subnets,
                          'securityGroups': [service_sg],
                          'assignPublicIp': 'DISABLED'
                      }
                  }
              )

              tasks = run_resp.get('tasks', [])
              if not tasks:
                  print('Failed to start migration task', file=sys.stderr)
                  sys.exit(1)

              task_arn = tasks[0]['taskArn']
              print(f'Started migration task: {task_arn}')

              waiter = ecs.get_waiter('tasks_stopped')
              waiter.wait(cluster=cluster, tasks=[task_arn])

              desc = ecs.describe_tasks(cluster=cluster, tasks=[task_arn])
              task_desc = desc['tasks'][0]
              container_desc = task_desc['containers'][0]
              exit_code = container_desc.get('exitCode', 1)
              reason = container_desc.get('reason', '')
              stop_reason = task_desc.get('stopReason', '')

              if exit_code != 0:
                  print(f'Migrations failed (exit={exit_code}, container_reason={reason}, task_reason={stop_reason})', file=sys.stderr)
                  sys.exit(exit_code)
              print('Migrations completed successfully.')
          finally:
              ecs.deregister_task_definition(taskDefinition=migrate_td_arn)
          PYCODE
