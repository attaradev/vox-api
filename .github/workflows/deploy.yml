name: Build and Deploy to AWS

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_WORKDIR: infra/terraform
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET_NAME }}
  TF_STATE_DDB_TABLE: ${{ secrets.TF_STATE_DDB_TABLE_NAME }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_NAME }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE_NAME }}
  ECS_TASK_FAMILY: ${{ secrets.ECS_TASK_FAMILY_NAME }}

jobs:
  bootstrap_state:
    name: Bootstrap TF Backend
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Ensure S3 bucket & DynamoDB table
        env:
          BUCKET: ${{ env.TF_STATE_BUCKET }}
          TABLE: ${{ env.TF_STATE_DDB_TABLE }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket exists."
          else
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration '{
              "Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration '{
              "BlockPublicAcls":true,"IgnorePublicAcls":true,"BlockPublicPolicy":true,"RestrictPublicBuckets":true}'
          fi

          if aws dynamodb describe-table --table-name "$TABLE" >/dev/null 2>&1; then
            echo "DynamoDB table exists."
          else
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --sse-specification Enabled=true
            aws dynamodb wait table-exists --table-name "$TABLE"
          fi

  terraform_infra:
    name: Terraform (Init/Plan/Apply)
    runs-on: ubuntu-latest
    needs: [bootstrap_state]
    permissions: { id-token: write, contents: read }
    outputs:
      ecr_repo_url: ${{ steps.outputs_step.outputs.ecr_repo_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with: { terraform_wrapper: false }

      - name: Terraform Init (with backend)
        working-directory: ${{ env.TF_WORKDIR }}
        env:
          BUCKET: ${{ env.TF_STATE_BUCKET }}
          TABLE: ${{ env.TF_STATE_DDB_TABLE }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=$BUCKET" \
            -backend-config="dynamodb_table=$TABLE" \
            -backend-config="key=global/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate & Plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform fmt -check
          terraform validate
          terraform plan -out=tfplan -input=false -no-color

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve -input=false tfplan

      - name: Capture outputs
        id: outputs_step
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          if terraform output -raw ecr_repository_url >/dev/null 2>&1; then
            echo "ecr_repo_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          else
            # fallback strip quotes
            echo "ecr_repo_url=$(terraform output ecr_repository_url | tr -d '"')" >> "$GITHUB_OUTPUT"
          fi

      - name: Show non-sensitive outputs
        working-directory: ${{ env.TF_WORKDIR }}
        run: |
          set -euo pipefail
          terraform output -no-color alb_dns_name || true
          terraform output -no-color alb_ip_addresses || true

  build_and_push_image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [terraform_infra]
    permissions: { id-token: write, contents: read }
    outputs:
      image: ${{ steps.build_push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: build_push
        env:
          ECR_REPO_URL: ${{ needs.terraform_infra.outputs.ecr_repo_url }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REPO_URL}:${IMAGE_TAG}"
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy_ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [build_and_push_image]
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false }

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Register new task definition revision
        id: register_td
        env:
          ECS_TASK_FAMILY: ${{ env.ECS_TASK_FAMILY }}
          NEW_IMAGE: ${{ needs.build_and_push_image.outputs.image }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' > td.json

          jq --arg img "$NEW_IMAGE" \
             '.containerDefinitions[0].image = $img |
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
             td.json > td-new.json

          NEW_TD_ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$NEW_TD_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        env:
          ECS_CLUSTER: ${{ env.ECS_CLUSTER }}
          ECS_SERVICE: ${{ env.ECS_SERVICE }}
          TASK_DEF_ARN: ${{ steps.register_td.outputs.task_definition_arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --query 'service.serviceArn' >/dev/null
