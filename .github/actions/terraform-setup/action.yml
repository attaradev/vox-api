name: "Terraform Setup"
description: "Setup Terraform with backend configuration"

inputs:
  working-directory:
    description: "Terraform working directory"
    required: true
  state-bucket:
    description: "Terraform state bucket"
    required: true
  backend-key:
    description: "Terraform backend key"
    required: true
  environment:
    description: "Deployment environment"
    required: true
  aws-region:
    description: "AWS region"
    required: true
  run-plan:
    description: "If 'true', run 'terraform plan' after init"
    required: false
    default: "false"
  run-apply:
    description: "If 'true', run 'terraform apply' after planning"
    required: false
    default: "false"
  plan-out:
    description: "Name of the plan output file (used by plan/apply)"
    required: false
    default: "tfplan"

runs:
  using: "composite"
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Prepare Terraform backend variables
      run: |
        set -euo pipefail
        echo "TF_VAR_environment=${{ inputs.environment }}" >> "$GITHUB_ENV"
        echo "TF_VAR_additional_tags={\"DeployedBy\":\"GitHubActions\",\"Workflow\":\"${GITHUB_WORKFLOW}\",\"RunId\":\"${GITHUB_RUN_ID}\",\"CommitSHA\":\"${GITHUB_SHA}\"}" >> "$GITHUB_ENV"
      shell: bash

    - name: Terraform Init (with backend)
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        terraform init -reconfigure -input=false \
          -backend-config="bucket=${{ inputs.state-bucket }}" \
          -backend-config="key=${{ inputs.backend-key }}" \
          -backend-config="region=${{ inputs.aws-region }}"
      shell: bash

    - name: Select / create workspace
      if: ${{ inputs.run-plan == 'true' || inputs.run-apply == 'true' }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Ensure the workspace exists for the target environment
        terraform workspace select "${{ inputs.environment }}" 2>/dev/null || terraform workspace new "${{ inputs.environment }}"
      shell: bash

    - name: Terraform plan
      if: ${{ inputs.run-plan == 'true' }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        terraform plan -input=false -out="${{ inputs.plan-out }}"
        # Export plan summary JSON for consumers if needed
        terraform show -json "${{ inputs.plan-out }}" > "${{ inputs.plan-out }}.json" || true
      shell: bash

    - name: Terraform apply (optional)
      if: ${{ inputs.run-apply == 'true' }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        terraform apply -input=false -auto-approve "${{ inputs.plan-out }}"
      shell: bash
