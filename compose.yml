name: vox app

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vox-api
    init: true
    env_file: .env
    volumes:
      - .:/app:cached
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: vox-celery
    init: true
    command: celery -A vox_api worker --loglevel=info
    env_file: .env
    environment:
      - RUN_DB_MIGRATIONS=0
    depends_on:
      - api
      - redis
    volumes:
      - .:/app:cached
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A vox_api inspect ping --timeout=1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  flower:
    image: mher/flower
    container_name: vox-flower
    env_file: .env
    environment:
      - FLOWER_BROKER=${CELERY_BROKER_URL}
    ports:
      - "5555:5555"
    depends_on:
      celery:
        condition: service_started
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: vox-redis
    ports:
      - "6399:6379"

  db:
    image: postgres:17-alpine
    container_name: vox-db
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
